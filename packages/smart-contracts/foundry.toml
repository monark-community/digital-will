[profile.default]
src = "contracts"
test = "tests"
script = "scripts"
out = ".out"
cache_path = ".cache"
libs = [".lib"]
remappings = [
    "@openzeppelin/=.lib/openzeppelin-contracts/",
    "@uniswap/v3-periphery=.lib/v3-periphery/",
    "@uniswap/v3-core=.lib/v3-core/",
    "@src/=contracts/",
    "@interfaces/=interfaces/",
    "@constants/=constants/",
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.19"
auto_detect_solc = false
